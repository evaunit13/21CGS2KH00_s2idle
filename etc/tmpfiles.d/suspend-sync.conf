# Prevent kernel ksys_sync() hang during suspend when network filesystems or FUSE (rclone) are mounted
w /sys/power/sync_on_suspend - - - - 0
w /sys/power/pm_debug_messages - - - - 1

# Fast task-freeze timeout: abort hung tasks after 3s instead of 20s to prevent sleep limbo
w /sys/power/pm_freeze_timeout - - - - 3000
